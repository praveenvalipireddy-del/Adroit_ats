services:
  - type: web
    name: adroit-ats
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APIFY_API_TOKEN
        value: your_apify_token_here
